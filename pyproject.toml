[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qkd"
version = "0.3.0"
description = "BB84 quantum key distribution (simulated with Qiskit Aer) feeding an AES-256-GCM file transfer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "qiskit>=1.0",
    "qiskit-aer>=0.14",
    "cryptography>=50",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
backend = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "zeroconf>=0.130",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]
hardware = ["qiskit-ibm-runtime>=0.20"]
dev = ["pytest>=8", "httpx>=0.27"]
experiments = ["pyyaml>=6", "matplotlib>=3.8"]

[project.scripts]
qkd-alice = "qkd.runner.alice:main"
qkd-bob = "qkd.runner.bob:main"
qkd-eve = "qkd.runner.eve:main"
qkd-node = "qkd.runner.node:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["."]
