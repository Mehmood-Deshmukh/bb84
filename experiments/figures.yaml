# Plot definitions for scripts/plot_figures.py.
# Each figure reads experiments/results/<source>_summary.csv (written by
# scripts/benchmark.py) and writes experiments/figures/<id>.png and .pdf.
# Kinds: rate, measure, stacked, bytes (see the script's docstring).
figures:
  - id: e1_detection
    kind: rate
    source: e1_detection
    x: QKD_NUM_QUBITS
    y: rate_qber_check
    series: eve_fraction
    ordinal: true
    series_label: "f = {:g}"
    legend_title: Eve intercepts
    analytic: detection
    analytic_label: "Binomial model"
    xscale: log2
    ylim: [-0.03, 1.05]  # small margin so lines at exactly 0 stay visible above the axis
    xlabel: Raw qubits N
    ylabel: Runs stopped by the QBER check
    title: QBER-check detection vs N (95% Wilson band)
    direct_labels: false
    legend_loc: outside

  - id: e2_outcomes
    kind: stacked
    source: e2_outcomes
    x: eve_fraction
    x_format: "{:g}"
    facet: mode
    facet_order: [none, hybrid]
    facet_label: "mode: {}"
    x_rotation: 45
    size: [10, 3.8]
    xlabel: Eve's intercept fraction f
    title: Where each run stops (N = 8192, all checks on)

  - id: e3_secure_length
    kind: measure
    source: e3_secure_length
    x: QKD_NUM_QUBITS
    y: secure_key_bits
    analytic: secure_length
    analytic_label: "Finite-key bound"
    hline: 256
    hline_label: "256-bit AES key"
    xscale: log2
    xlabel: Raw qubits N
    ylabel: Secure key bits
    title: Finite-key secure length on a clean channel

  - id: e3_simulation_time
    kind: measure
    source: e3_secure_length
    x: QKD_NUM_QUBITS
    y: sim_s
    xscale: log2
    xlabel: Raw qubits N
    ylabel: Seconds (median, IQR band)
    title: Simulator time vs N (QRNG, prepare, measure)

  - id: e4_protocol_time
    kind: measure
    source: e4_overhead
    x: payload_bytes
    y: protocol_minus_sim_s
    scale: 1000
    series: mode
    series_order: [none, sign, hybrid]
    xscale: log
    yscale: log
    xlabel: Payload (bytes)
    ylabel: Milliseconds, simulator time excluded
    title: Protocol time by mode and payload
    direct_labels: false  # lines converge at 100 MB, end labels would collide
    legend_loc: upper left

  - id: e4_end_to_end
    kind: measure
    source: e4_overhead
    x: payload_bytes
    y: end_to_end_minus_sim_s
    scale: 1000
    series: mode
    series_order: [none, sign, hybrid]
    xscale: log
    yscale: log
    xlabel: Payload (bytes)
    ylabel: Milliseconds, simulator time excluded
    title: Until Bob has the file, by mode and payload
    direct_labels: false  # lines converge at 100 MB, end labels would collide
    legend_loc: upper left

  - id: e4_handshake
    kind: measure
    source: e4_overhead
    x: payload_bytes
    y: handshake_ms
    series: mode
    series_order: [none, sign, hybrid]
    xscale: log
    xlabel: Payload (bytes)
    ylabel: Milliseconds
    title: Hello + finished exchange time by mode

  - id: e5_wire_bytes
    kind: bytes
    source: e4_overhead
    facet: payload_bytes
    facet_values: [1024, 1048576]
    facet_label: "payload {}"
    ylabel: KiB on the wire (median)
    title: Bytes on the wire by component

  - id: e6_latency
    kind: measure
    source: e6_latency
    x: rtt_ms
    y: protocol_minus_sim_s
    scale: 1000
    series: mode
    series_order: [none, sign, hybrid]
    xlabel: Added round-trip time (ms)
    ylabel: Milliseconds, simulator time excluded
    title: Protocol time vs network round-trip time
    direct_labels: false  # sign and hybrid lines overlap, end labels would collide
    legend_loc: upper left

  - id: n0_click_rate
    kind: measure
    source: n0_channel
    x: QKD_CHANNEL_LENGTH_KM
    y: click_rate
    series: QKD_CHANNEL_PRESET
    series_order: [GYS, KTH]
    analytic_column: model_click_prob
    analytic_label: Channel model
    yscale: log
    xlabel: Fibre length (km)
    ylabel: Detected / sent pulses
    title: Click rate vs distance, measured and modelled
    legend_loc: upper right

  - id: n0_qber
    kind: measure
    source: n0_channel
    x: QKD_CHANNEL_LENGTH_KM
    y: qber
    series: QKD_CHANNEL_PRESET
    series_order: [GYS, KTH]
    analytic_column: model_qber
    analytic_label: Channel model
    hline: 0.11
    hline_label: "11% abort threshold"
    xlabel: Fibre length (km)
    ylabel: QBER (sampled)
    title: QBER vs distance, measured and modelled
    legend_loc: upper left

  - id: e1n_detection
    kind: rate
    source: e1n_detection
    x: target_detected
    y: rate_qber_check
    series: eve_fraction
    ordinal: true
    series_label: "f = {:g}"
    legend_title: Eve intercepts
    xscale: log2
    ylim: [-0.03, 1.05]
    direct_labels: false
    legend_loc: outside
    xlabel: Pulses detected at Bob
    ylabel: Runs stopped by the QBER check
    title: Detection on a GYS 25 km link (95% Wilson band)
