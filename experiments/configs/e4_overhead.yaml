# E4: cost of authentication by mode and payload, at the default N with every check on.
# Per-stage times come from the runners' events; sim_s separates the simulator's share.
# The byte columns (qubit_bytes, channel_bytes, auth_overhead_bytes, file_wire_bytes)
# also feed E5, the wire size breakdown.
name: e4_overhead
description: Per-stage time and bytes on the wire by authentication mode and payload size
repeats: 30
grid:
  mode: [none, sign, hybrid]
  payload_bytes: [1024, 1048576, 10485760, 104857600]
